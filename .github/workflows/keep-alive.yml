name: Bot Keep-Alive & Maintenance

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (Maximum frequency)
    - cron: '0 0 * * *'    # Once a day at midnight for a fresh restart
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-Alive Ping
        run: |
          # Use secret if available, otherwise try the default URL
          URL="${{ secrets.RENDER_EXTERNAL_URL }}"
          if [ -z "$URL" ]; then
            URL="https://mani-md-bot-fdkz.onrender.com"
          fi
          
          echo "📡 Pinging: $URL/ping"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL/ping")
          echo "📥 Response Code: $RESPONSE"
          
          if [ "$RESPONSE" != "200" ]; then
            echo "⚠️ Bot is sleeping or down. Triggering Render Deploy Hook..."
            curl -X POST "https://api.render.com/deploy/srv-d9kc8q3tqb8s73b88dvg?key=svdYViZ5-dk"
          else
            echo "✅ Bot is active and responding."
          fi

      - name: Daily Fresh Restart
        if: github.event.schedule == '0 0 * * *'
        run: |
          echo "🚀 Performing scheduled daily restart..."
          curl -X POST "https://api.render.com/deploy/srv-d9kc8q3tqb8s73b88dvg?key=svdYViZ5-dk"
