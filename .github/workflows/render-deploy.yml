name: Auto Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          echo "🚀 Triggering Render deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.render.com/deploy/srv-d9kc8q3tqb8s73b88dvg?key=svdYViZ5-dk" --max-time 30)
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "Response: $RESPONSE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deploy triggered successfully!"
          else
            echo "⚠️ Deploy hook returned HTTP $HTTP_CODE - Render may auto-deploy from webhook"
          fi
      - name: Also trigger bot's internal deploy endpoint
        run: |
          sleep 10
          echo "🔄 Triggering bot's internal deploy endpoint..."
          curl -s "https://mani-md-bot-fdkz.onrender.com/deploy?key=svdYViZ5-dk" --max-time 30 || echo "Bot may be restarting..."
